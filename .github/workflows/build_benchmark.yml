name: Benchmark Builder
# Manually build the benchmark variant for performance testing on a device.
#
# The benchmark build type uses applicationId app.tegaki.benchmark, so it installs alongside
# stable and test. It is a throwaway dev artifact that is never published, so it is signed with
# whatever debug key the runner generates — no release secrets are involved. The macrobenchmark
# tests themselves need a physical device, so this only produces the APK to run them against.

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build benchmark APK
    runs-on: 'ubuntu-24.04'

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check code format
        run: ./gradlew spotlessCheck

      - name: Build benchmark APKs
        run: ./gradlew assembleBenchmark

      - name: Rename APKs
        run: |
          set -e
          VERSION=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          cd app/build/outputs/apk/benchmark
          for f in app-*-benchmark.apk; do
            [ -e "$f" ] || continue
            abi="${f#app-}"; abi="${abi%-benchmark.apk}"
            mv "$f" "Tegaki-${VERSION}-${abi}-benchmark.apk"
          done
          ls -la

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Tegaki-benchmark
          path: app/build/outputs/apk/benchmark/*.apk
          retention-days: 30
