name: Build APK
# Manually build an installable (debug-signed) preview APK. No secrets required.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build preview APK
    runs-on: 'ubuntu-24.04'

    steps:
      - name: Clone repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build preview APK
        run: ./gradlew assemblePreview

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Komikku-scanlator-filter-apk
          path: app/build/outputs/apk/preview/*.apk
