name: Build APK
# Manually build an installable preview APK.
# If the DEBUG_KEYSTORE_B64 secret is set, all builds are signed with that fixed
# key so they install as in-place updates over each other. Without it, the build
# still works but uses an ephemeral debug key (updates require a reinstall).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build preview APK
    runs-on: 'ubuntu-24.04'

    steps:
      - name: Clone repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore pinned signing key
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$DEBUG_KEYSTORE_B64" ]; then
            mkdir -p ~/.android
            echo "$DEBUG_KEYSTORE_B64" | base64 -d > ~/.android/debug.keystore
            echo "Restored pinned debug keystore for stable signing."
          else
            echo "No DEBUG_KEYSTORE_B64 secret set; using an ephemeral debug key."
          fi

      - name: Build preview APK
        run: ./gradlew assemblePreview

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Komikku-scanlator-filter-apk
          path: app/build/outputs/apk/preview/*.apk
