name: Build APK
# Manually build an installable preview APK.
# If the DEBUG_KEYSTORE_B64 secret is set, all builds are signed with that fixed
# key so they install as in-place updates over each other. Without it, the build
# still works but uses an ephemeral debug key (updates require a reinstall).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build preview APK
    runs-on: 'ubuntu-24.04'

    steps:
      - name: Clone repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build preview APK
        # Signed with the same release key as the published channels, so an APK from here can
        # update a real install. Signing with the old debug key here would silently produce
        # APKs that refuse to install over anything the release workflows built.
        run: ./gradlew assemblePreview -Penable-updater
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tegaki-apk
          path: app/build/outputs/apk/preview/*.apk
