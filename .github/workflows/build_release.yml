name: Release Builder
# Builds and publishes a stable release when a v* tag is pushed.
#
# The APK is built and signed here rather than on a workstation so the published binary is
# verifiably produced from the tagged commit. Signing happens inside Gradle (see
# app/build.gradle.kts) using the RELEASE_KEYSTORE_* secrets — the key is never handed to a
# third-party action.
#
# Required repository secrets:
#   RELEASE_KEYSTORE_BASE64    base64 of release.keystore
#   RELEASE_KEYSTORE_PASSWORD  keystore password
#   RELEASE_KEY_ALIAS          key alias (tegaki)
#   RELEASE_KEY_PASSWORD       key password

on:
  push:
    tags:
      - v*
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build and publish release
    runs-on: 'ubuntu-24.04'

    steps:
      - name: Clone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get tag name
        id: tag
        run: |
          set -e
          VERSION_TAG="${GITHUB_REF#refs/tags/}"
          echo "VERSION_TAG=$VERSION_TAG" >> $GITHUB_OUTPUT
          echo "VERSION=${VERSION_TAG#v}" >> $GITHUB_OUTPUT

      - name: Verify tag matches versionName
        run: |
          set -e
          VERSION_NAME=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          if [ "${{ steps.tag.outputs.VERSION }}" != "$VERSION_NAME" ]; then
            echo "::error::Tag ${{ steps.tag.outputs.VERSION_TAG }} does not match versionName $VERSION_NAME"
            exit 1
          fi
          echo "Tag matches versionName $VERSION_NAME"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Check code format
        run: ./gradlew spotlessCheck

      - name: Run unit tests
        run: ./gradlew testReleaseUnitTest

      - name: Build signed APKs
        run: ./gradlew assemblePreview -Penable-updater
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Verify APKs are signed with the release key
        run: |
          set -e
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -r | head -1)
          APK=app/build/outputs/apk/preview/app-arm64-v8a-preview.apk
          "$APKSIGNER" verify --print-certs "$APK"
          if "$APKSIGNER" verify --print-certs "$APK" | grep -q 'CN=Android Debug'; then
            echo "::error::Signed with the debug keystore — release secrets are missing or wrong"
            exit 1
          fi

      - name: Rename APKs
        run: |
          set -e
          cd app/build/outputs/apk/preview
          V="${{ steps.tag.outputs.VERSION }}"
          mv app-arm64-v8a-preview.apk   "Tegaki-${V}-arm64-v8a.apk"
          mv app-armeabi-v7a-preview.apk "Tegaki-${V}-armeabi-v7a.apk"
          mv app-x86-preview.apk         "Tegaki-${V}-x86.apk"
          mv app-x86_64-preview.apk      "Tegaki-${V}-x86_64.apk"
          mv app-universal-preview.apk   "Tegaki-${V}-universal.apk"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.VERSION_TAG }}
          name: Tegaki ${{ steps.tag.outputs.VERSION }}
          draft: true
          prerelease: false
          files: |
            app/build/outputs/apk/preview/Tegaki-${{ steps.tag.outputs.VERSION }}-arm64-v8a.apk
            app/build/outputs/apk/preview/Tegaki-${{ steps.tag.outputs.VERSION }}-universal.apk
